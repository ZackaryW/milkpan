[package]
name = "milkpan"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Lightweight GitHub resource bucket: acquire, cache and lease repo snapshots, files and release assets."
readme = "README.md"

[dependencies]
panned = { git = "https://github.com/ZackaryW/panned" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
tar = "0.4"
flate2 = "1"
ureq = { version = "2", features = ["json"] }
dirs = "6"
clap = "4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
junction = "1"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
